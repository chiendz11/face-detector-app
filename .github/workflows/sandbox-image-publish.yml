name: Reusable Sandbox Image Publish

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    outputs:
      backend_digest:
        value: ${{ jobs.publish.outputs.backend_digest }}
      frontend_digest:
        value: ${{ jobs.publish.outputs.frontend_digest }}
      nginx_digest:
        value: ${{ jobs.publish.outputs.nginx_digest }}

permissions:
  contents: read

jobs:
  build-untrusted-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted build control plane
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: master
          persist-credentials: false

      - name: Checkout requested application commit as untrusted data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_sha }}
          path: sources/app
          persist-credentials: false

      - name: Select deployable application images
        run: |
          mkdir -p .artifacts
          jq '[.[] | select(.name == "backend" or .name == "frontend-admin" or .name == "nginx")]' \
            .github/image-catalog.json > .artifacts/sandbox-image-catalog.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build sandbox images without registry credentials
        uses: ./.github/actions/build-images
        with:
          image_host: local.invalid/${{ github.repository_owner }}
          image_tag: ${{ inputs.source_sha }}
          catalog_path: .artifacts/sandbox-image-catalog.json
          source_root: sources/app

      - name: Save untrusted image output as data
        uses: ./.github/actions/save-images
        with:
          image_host: local.invalid/${{ github.repository_owner }}
          image_tag: ${{ inputs.source_sha }}
          catalog_path: .artifacts/sandbox-image-catalog.json

      - name: Upload sandbox image archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-image-archives
          path: .artifacts/images
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build-untrusted-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.digests.outputs.backend_digest }}
      frontend_digest: ${{ steps.digests.outputs.frontend_digest }}
      nginx_digest: ${{ steps.digests.outputs.nginx_digest }}
    steps:
      - name: Checkout trusted publisher control plane
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: master
          persist-credentials: false

      - name: Select deployable application images
        run: |
          mkdir -p .artifacts
          jq '[.[] | select(.name == "backend" or .name == "frontend-admin" or .name == "nginx")]' \
            .github/image-catalog.json > .artifacts/sandbox-image-catalog.json

      - name: Download image archives from isolated builder
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sandbox-image-archives
          path: .artifacts/images

      - name: Load image archives without running application code
        uses: ./.github/actions/load-images
        with:
          catalog_path: .artifacts/sandbox-image-catalog.json

      - name: Retag images for GHCR
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ inputs.source_sha }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          while IFS= read -r row; do
            repository=$(jq -r '.repository' <<< "$row")
            docker tag \
              "local.invalid/$OWNER/$repository:$IMAGE_TAG" \
              "ghcr.io/$owner/$repository:$IMAGE_TAG"
          done < <(jq -c '.[]' .artifacts/sandbox-image-catalog.json)

      - name: Log in to GHCR with repository-scoped token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push deployable sandbox images
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ inputs.source_sha }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          for repository in face-detector-backend face-detector-admin face-detector-nginx; do
            docker push "ghcr.io/$owner/$repository:$IMAGE_TAG"
          done

      - name: Resolve immutable sandbox digests
        id: digests
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ inputs.source_sha }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "backend_digest=$(python scripts/resolve_registry_digest.py --repository "$owner/face-detector-backend" --reference "$IMAGE_TAG" --username "$REGISTRY_USERNAME" --password "$REGISTRY_PASSWORD")" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$(python scripts/resolve_registry_digest.py --repository "$owner/face-detector-admin" --reference "$IMAGE_TAG" --username "$REGISTRY_USERNAME" --password "$REGISTRY_PASSWORD")" >> "$GITHUB_OUTPUT"
          echo "nginx_digest=$(python scripts/resolve_registry_digest.py --repository "$owner/face-detector-nginx" --reference "$IMAGE_TAG" --username "$REGISTRY_USERNAME" --password "$REGISTRY_PASSWORD")" >> "$GITHUB_OUTPUT"
