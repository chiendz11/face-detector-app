global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: face-detector-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000
        labels:
          namespace: local
          service: backend
          app: face-detector
          component: backend

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          namespace: local
          service: prometheus
          app: monitoring
          component: prometheus
